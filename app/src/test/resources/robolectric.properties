# The real Application loads libiroh_webview_proxy.so, which is cross-compiled
# for a phone and cannot be opened by a JVM on the build host. Tests run against
# a stand-in that skips the load; everything the activity does with the proxy
# goes through the injected ProxyController instead, which is the boundary
# worth testing anyway.
application=com.example.irohbrowser.testing.TestApp
